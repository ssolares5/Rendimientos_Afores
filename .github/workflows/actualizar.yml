name: Actualizar rendimientos

on:
  schedule:
    - cron: '20 2 * * 2-6'    # 20:20 hora CDMX, lunes a viernes
    - cron: '40 14 * * 1-5'   # 08:40 hora CDMX, por si la BMV publicó tarde
  workflow_dispatch: {}        # botón "Run workflow" para correrlo a mano

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Bajar precios de la BMV y calcular
        run: python update.py

      - name: Guardar precios en el repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prices.json data.json
          git diff --cached --quiet || git commit -m "Precios $(date -u +%Y-%m-%d)"
          git push

      - name: Preparar sitio
        run: |
          mkdir -p _site
          cp index.html data.json _site/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4
